<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0A2E6E">
<title>SHOPCHATTA — Shop. Chat. Earn. All In One Place.</title>
<!--
  SHOPCHATTA — Founder: Emmanuel
  ONE FILE: HTML + CSS + JavaScript + Supabase JS (+ localStorage backup).
  1) Scroll to CONFIG (near the top of the <script>) and paste your Project URL + Publishable Key.
  2) Open the app > Menu > Settings > Data, Storage & Help > "Supabase setup SQL" and run the SQL once in Supabase > SQL Editor.
  3) Put your own email in CONFIG.ADMIN_EMAIL so you become the Admin.
-->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--blue:#0A2E6E;--blue2:#1450C8;--green:#00E676;--green2:#00B85C;--bg:#F3F6FC;--card:#fff;--ink:#0B1B3A;--mut:#5B6B8C;--line:#E1E7F2;--shadow:0 6px 24px rgba(10,46,110,.10);--r:16px;--warn:#F59E0B;--bad:#E5484D}
[data-theme=dark]{--bg:#06122B;--card:#0E2147;--ink:#EAF1FF;--mut:#9DB0D6;--line:#1C3668;--shadow:0 6px 24px rgba(0,0,0,.45)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);line-height:1.45;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--blue2);box-shadow:0 0 0 3px rgba(20,80,200,.16)}
input[type=checkbox]{width:auto}
textarea{resize:vertical;min-height:80px}
label{display:block;font-size:.8rem;font-weight:600;color:var(--mut);margin:11px 0 4px}
h1,h2,h3{line-height:1.2}
h2{font-size:1.25rem;margin-bottom:10px}
h3{font-size:1.05rem;margin-bottom:8px}
a{color:var(--blue2)}
.mut{color:var(--mut);font-size:.88rem}
.sm{font-size:.8rem}
.hide{display:none!important}
#app{max-width:1000px;margin:0 auto;min-height:100vh;position:relative;background:var(--bg)}
.top{position:sticky;top:0;z-index:30;background:linear-gradient(120deg,var(--blue),#0E3C94);color:#fff;padding:10px 14px;display:flex;align-items:center;gap:10px;padding-top:calc(10px + env(safe-area-inset-top))}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;letter-spacing:.3px;cursor:pointer;font-size:1.1rem}
.brand b{color:var(--green)}
.top .sp{flex:1}
.ibtn{background:rgba(255,255,255,.12);border:0;color:#fff;border-radius:12px;min-width:40px;height:40px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;position:relative;padding:0 10px;gap:6px;font-weight:600;font-size:.82rem}
.ibtn svg{width:20px;height:20px}
.badge{position:absolute;top:-4px;right:-4px;background:var(--green);color:var(--blue);font-size:.65rem;font-weight:800;border-radius:10px;min-width:18px;height:18px;display:flex;align-items:center;justify-content:center;padding:0 4px}
svg.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:middle}
#view{padding:14px 14px 96px;min-height:70vh}
#nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:1000px;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:space-around;align-items:flex-end;padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:30;box-shadow:0 -6px 20px rgba(10,46,110,.08)}
#nav button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--mut);font-size:.68rem;font-weight:600;cursor:pointer;flex:1;padding:4px 0;position:relative}
#nav button.on{color:var(--blue2)}
[data-theme=dark] #nav button.on{color:var(--green)}
#nav .sellbtn span.plus{width:48px;height:48px;border-radius:50%;background:linear-gradient(135deg,var(--green),var(--green2));color:var(--blue);display:flex;align-items:center;justify-content:center;margin-top:-22px;box-shadow:0 6px 16px rgba(0,230,118,.45)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:var(--shadow);margin-bottom:12px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.row.end{justify-content:flex-end}.row.sb{justify-content:space-between}
.gap{gap:10px}.col{display:flex;flex-direction:column;gap:8px}
.grow{flex:1;min-width:0}
.btn{border:0;border-radius:12px;padding:11px 16px;font-weight:700;cursor:pointer;background:var(--blue2);color:#fff;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:.15s;font-size:.92rem}
.btn:hover{filter:brightness(1.08)}.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn-g{background:linear-gradient(135deg,var(--green),var(--green2));color:#042a14}
.btn-o{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.btn-d{background:var(--bad)}
.btn-s{padding:7px 11px;font-size:.8rem;border-radius:10px}
.btn-block{width:100%}
.btn-wa{background:#25D366;color:#073b1a}
.chip{display:inline-flex;align-items:center;gap:4px;padding:6px 12px;border-radius:999px;background:var(--card);border:1.5px solid var(--line);font-size:.82rem;font-weight:600;cursor:pointer;white-space:nowrap;color:var(--ink)}
.chip.on{background:var(--blue2);color:#fff;border-color:var(--blue2)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;scrollbar-width:none}
.tabs button{background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:8px 14px;font-weight:700;font-size:.85rem;cursor:pointer;white-space:nowrap;color:var(--mut)}
.tabs button.on{background:var(--blue);border-color:var(--blue);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:12px}
.pc{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;cursor:pointer;box-shadow:var(--shadow);transition:.15s}
.pc:hover{transform:translateY(-2px)}
.pimg{position:relative;aspect-ratio:1/1;background:var(--line)}
.pimg img{width:100%;height:100%;object-fit:cover;display:block}
.tag{position:absolute;top:8px;left:8px;background:var(--blue);color:#fff;font-size:.66rem;font-weight:700;padding:3px 8px;border-radius:8px}
.tag.g{background:var(--green);color:#042a14;top:8px}
.tag.c{left:auto;right:8px;background:rgba(10,46,110,.8)}
.tag.s{top:auto;bottom:8px;background:var(--warn);color:#2a1a00}
.fv{position:absolute;bottom:8px;right:8px;width:34px;height:34px;border-radius:50%;border:0;background:rgba(255,255,255,.92);color:#555;cursor:pointer;display:flex;align-items:center;justify-content:center}
.fv.on{color:#e0245e}.fv.on svg{fill:#e0245e}
.pb{padding:10px}.pp{font-weight:800;color:var(--blue2);font-size:1rem}
[data-theme=dark] .pp{color:var(--green)}
.pt{font-size:.88rem;font-weight:600;margin:2px 0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pm{font-size:.72rem;color:var(--mut)}
.av{border-radius:50%;object-fit:cover;background:var(--line);flex:none;display:inline-flex;align-items:center;justify-content:center;font-weight:800;color:var(--blue);overflow:hidden}
.vb{color:var(--blue2);display:inline-flex;vertical-align:middle}.vb svg{width:15px;height:15px;fill:var(--blue2);stroke:#fff}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:.7rem;font-weight:800;background:var(--line);color:var(--ink)}
.pill.g{background:rgba(0,230,118,.18);color:#007a3a}.pill.b{background:rgba(20,80,200,.14);color:var(--blue2)}.pill.w{background:rgba(245,158,11,.2);color:#9a6200}.pill.r{background:rgba(229,72,77,.16);color:var(--bad)}
.hero{background:linear-gradient(135deg,var(--blue) 0%,#1450C8 70%);color:#fff;border-radius:22px;padding:22px 18px;margin-bottom:14px;position:relative;overflow:hidden}
.hero h1{font-size:1.6rem;margin:8px 0 6px}.hero h1 b{color:var(--green)}
.hero p{opacity:.9;margin-bottom:14px}
.hero:after{content:"";position:absolute;right:-40px;top:-40px;width:180px;height:180px;border-radius:50%;background:radial-gradient(circle,rgba(0,230,118,.45),transparent 70%)}
.banner{background:linear-gradient(90deg,var(--green),#7DFFB3);color:#042a14;padding:10px 14px;border-radius:14px;font-weight:600;margin-bottom:12px;font-size:.9rem}
.warnbar{background:#FFF4D6;color:#6b4700;border:1px solid #F3D58A;padding:10px 12px;border-radius:12px;margin-bottom:12px;font-size:.84rem}
.sect{display:flex;justify-content:space-between;align-items:center;margin:16px 0 8px}.sect h3{margin:0}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center}
.stat b{display:block;font-size:1.25rem;color:var(--blue2)}[data-theme=dark] .stat b{color:var(--green)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:12px}
.bar{height:8px;background:var(--line);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--blue2),var(--green))}
#modal .ov{position:fixed;inset:0;background:rgba(3,12,32,.6);z-index:60;display:flex;align-items:flex-end;justify-content:center;backdrop-filter:blur(3px)}
#modal .sheet{background:var(--card);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
#modal .sheet.wide{max-width:760px}
@media(min-width:700px){#modal .ov{align-items:center}#modal .sheet{border-radius:22px}}
#toast{position:fixed;left:0;right:0;bottom:90px;display:flex;flex-direction:column;align-items:center;gap:8px;z-index:90;pointer-events:none;padding:0 14px}
#toast .t{background:var(--blue);color:#fff;padding:11px 16px;border-radius:14px;font-weight:600;box-shadow:var(--shadow);max-width:520px;font-size:.88rem;border-left:5px solid var(--green)}
#toast .t.err{background:#7a1519;border-left-color:#ff6b6b}
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.sbox{position:relative}.sbox svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--mut)}.sbox input{padding-left:40px}
.gal{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;border-radius:var(--r)}
.gal img{width:100%;max-height:420px;object-fit:cover;scroll-snap-align:center;flex:none;border-radius:var(--r)}
.big{font-size:1.6rem;font-weight:800;color:var(--blue2)}[data-theme=dark] .big{color:var(--green)}
.chatwrap{display:flex;flex-direction:column;height:calc(100vh - 150px);min-height:420px}
#msgs{flex:1;overflow:auto;display:flex;flex-direction:column;gap:8px;padding:10px 4px}
.msg{max-width:82%;padding:9px 12px;border-radius:16px;background:var(--card);border:1px solid var(--line);align-self:flex-start;word-wrap:break-word}
.msg.me{align-self:flex-end;background:var(--blue2);color:#fff;border-color:var(--blue2)}
.msg .who{font-size:.7rem;font-weight:700;color:var(--green2);margin-bottom:2px}
.msg .tm{font-size:.65rem;opacity:.7;margin-top:3px;text-align:right}
.msg .acts{display:flex;gap:8px;margin-top:5px;flex-wrap:wrap}
.msg .acts button{background:rgba(127,127,127,.18);border:0;border-radius:8px;padding:3px 8px;font-size:.72rem;font-weight:700;cursor:pointer;color:inherit;display:inline-flex;gap:4px;align-items:center}
.msg audio{max-width:220px;height:34px}
.composer{display:flex;gap:8px;align-items:flex-end;padding-top:8px}
.composer textarea{min-height:44px;max-height:110px;border-radius:22px}
#micBtn{touch-action:none;user-select:none;-webkit-user-select:none;width:46px;height:46px;border-radius:50%;border:0;background:var(--line);color:var(--ink);cursor:pointer;flex:none;display:flex;align-items:center;justify-content:center}
#micBtn.rec{background:var(--bad);color:#fff;animation:pulse 1s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(229,72,77,.6)}100%{box-shadow:0 0 0 16px rgba(229,72,77,0)}}
.sendb{width:46px;height:46px;border-radius:50%;border:0;background:var(--green);color:#042a14;cursor:pointer;flex:none;display:flex;align-items:center;justify-content:center}
.pcard{display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px;margin-bottom:8px;cursor:pointer}
.pcard img{width:54px;height:54px;border-radius:10px;object-fit:cover}
.li{display:flex;gap:12px;align-items:center;padding:12px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.li:last-child{border-bottom:0}
details.set{background:var(--card);border:1px solid var(--line);border-radius:var(--r);margin-bottom:10px;overflow:hidden}
details.set summary{padding:14px;font-weight:700;cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center}
details.set summary::-webkit-details-marker{display:none}
details.set summary:after{content:"›";transform:rotate(90deg);font-size:1.3rem;color:var(--mut);transition:.2s}
details.set[open] summary:after{transform:rotate(-90deg)}
details.set .in{padding:0 14px 14px}
.trow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px dashed var(--line)}
.trow:last-child{border-bottom:0}
.sw{position:relative;width:46px;height:26px;flex:none}.sw input{opacity:0;width:100%;height:100%;position:absolute;inset:0;cursor:pointer;z-index:2}
.sw i{position:absolute;inset:0;background:var(--line);border-radius:20px;transition:.2s}
.sw i:before{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;background:#fff;border-radius:50%;transition:.2s}
.sw input:checked+i{background:var(--green2)}.sw input:checked+i:before{transform:translateX(20px)}
.steps{display:flex;gap:4px;margin:8px 0}
.steps div{flex:1;text-align:center;font-size:.68rem;font-weight:700;color:var(--mut)}
.steps div:before{content:"";display:block;height:6px;border-radius:4px;background:var(--line);margin-bottom:4px}
.steps div.on{color:var(--green2)}.steps div.on:before{background:var(--green)}
.post video,.post img.pm{width:100%;border-radius:12px;max-height:480px;object-fit:cover;background:#000}
.starbtn{background:none;border:0;font-size:1.7rem;color:#c8d1e4;cursor:pointer}.starbtn.on{color:#FFB400}
.tbl{width:100%;border-collapse:collapse;font-size:.82rem}.tbl th,.tbl td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left}
.scroll{overflow-x:auto}
.empty{text-align:center;padding:30px 10px;color:var(--mut)}
.empty .em{font-size:2.4rem}
.authwrap{max-width:460px;margin:0 auto}
.avpick{width:92px;height:92px;border-radius:50%;border:2px dashed var(--blue2);display:flex;align-items:center;justify-content:center;overflow:hidden;cursor:pointer;margin:6px auto;background:var(--bg);color:var(--blue2);text-align:center;font-size:.7rem;font-weight:700}
.avpick img{width:100%;height:100%;object-fit:cover}
.splash{position:fixed;inset:0;background:linear-gradient(160deg,var(--blue),#1450C8);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;z-index:100;gap:10px;transition:opacity .4s}
.splash b{font-size:1.8rem;letter-spacing:1px}.splash span{color:var(--green);font-weight:700}
pre.sql{background:#06122B;color:#9ef7c5;padding:12px;border-radius:12px;font-size:.7rem;max-height:300px;overflow:auto;white-space:pre-wrap}
.menu-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.menu-grid .card{text-align:center;cursor:pointer;margin:0;padding:16px 8px;font-weight:700;font-size:.88rem}
.menu-grid svg{width:26px;height:26px;color:var(--blue2);display:block;margin:0 auto 6px}
@media(min-width:900px){.grid{grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}.hero h1{font-size:2.2rem}}
</style>
</head>
<body>
<div class="splash" id="splash"><div id="splashLogo"></div><b>SHOP<span>CHATTA</span></b><div class="mut" style="color:#cfe0ff">Shop. Chat. Earn. All In One Place.</div></div>
<div id="app"><header class="top" id="top"></header><main id="view"></main><nav id="nav"></nav></div>
<div id="modal"></div><div id="toast"></div>
<script>
'use strict';
/* =====================================================================
   CONFIG — paste your Supabase details here (the only part you must edit)
   ===================================================================== */
const CONFIG={
  SUPABASE_URL:'PUT YOUR PROJECT URL HERE',
  SUPABASE_KEY:'PUT YOUR KEY HERE',
  ADMIN_EMAIL:'',            // Emmanuel's email -> becomes Admin on registration
  PAYSTACK_KEY:'',           // optional Paystack public key (pk_live_… / pk_test_…) for real card payments
  SUPPORT_WHATSAPP:'',       // optional support number with country code, e.g. 2348012345678
  COMMISSION:0.05, PRO_PRICE_USD:4.99, BOOST_PRICE_USD:2, BIG_WITHDRAW_USD:300, REF_BONUS_USD:1,
  DEMO_CODES:true,           // shows verification codes on screen until a real SMS/email sender is wired to the "outbox" table
  MEDIA_BUCKET:'media'
};
const CLOUD_ON=/^https?:\/\//.test(CONFIG.SUPABASE_URL)&&!!CONFIG.SUPABASE_KEY&&!/PUT YOUR/i.test(CONFIG.SUPABASE_KEY);
let sb=null;
try{ if(CLOUD_ON&&window.supabase) sb=window.supabase.createClient(CONFIG.SUPABASE_URL,CONFIG.SUPABASE_KEY); }catch(e){ console.warn('Supabase init failed',e); }

/* ============================ helpers ============================ */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{const r=Math.random()*16|0;return(c==='x'?r:(r&3|8)).toString(16)});
const now=()=>new Date().toISOString();
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const ago=ts=>{const s=(Date.now()-new Date(ts))/1000;if(s<60)return'now';if(s<3600)return Math.floor(s/60)+'m';if(s<86400)return Math.floor(s/3600)+'h';return new Date(ts).toLocaleDateString()};
const clock=ts=>new Date(ts).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
const first=n=>String(n||'Someone').trim().split(/\s+/)[0];
const loadScript=src=>new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=()=>rej(Error('Could not load '+src));document.head.appendChild(s)});
const LS='shopchatta.';
const lsGet=(k,d)=>{try{const v=localStorage.getItem(LS+k);return v===null?d:JSON.parse(v)}catch(e){return d}};
let lsWarned=false;
const lsSet=(k,v)=>{try{localStorage.setItem(LS+k,JSON.stringify(v))}catch(e){if(!lsWarned){lsWarned=true;toast('Device storage is full — new data is kept in the cloud only.','err')}}};

/* ============================ hashing / codes ============================ */
async function sha(s){try{if(crypto&&crypto.subtle){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}}catch(e){}let h=5381;for(let i=0;i<s.length;i++)h=((h<<5)+h)+s.charCodeAt(i);return'djb'+(h>>>0).toString(16)}
const genCode=()=>String(Math.floor(100000+Math.random()*900000));

/* ============================ media ============================ */
function fileToDataURL(file,max=760,q=.72){return new Promise((res,rej)=>{if(!file.type.startsWith('image/')){const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(file);return}
  const img=new Image(),url=URL.createObjectURL(file);img.onload=()=>{const k=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);res(c.toDataURL('image/jpeg',q))};img.onerror=()=>rej(Error('Could not read this image.'));img.src=url})}
const dataURLtoBlob=d=>{const [h,b]=d.split(',');const m=/data:(.*?);base64/.exec(h)[1];const bin=atob(b);const a=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);return new Blob([a],{type:m})};
const blobToDataURL=b=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(b)});
async function storeMedia(file){ // images: compress; try Supabase Storage first, fallback to embedded data URL
  const isImg=file.type.startsWith('image/');
  if(isImg){const d=await fileToDataURL(file);if(sb){try{const path=`${S.meId||'anon'}/${Date.now()}-${Math.random().toString(16).slice(2)}.jpg`;const {error}=await sb.storage.from(CONFIG.MEDIA_BUCKET).upload(path,dataURLtoBlob(d),{contentType:'image/jpeg'});if(!error)return sb.storage.from(CONFIG.MEDIA_BUCKET).getPublicUrl(path).data.publicUrl}catch(e){}}return d}
  if(sb){try{const path=`${S.meId||'anon'}/${Date.now()}-${file.name.replace(/[^\w.]/g,'_')}`;const {error}=await sb.storage.from(CONFIG.MEDIA_BUCKET).upload(path,file,{contentType:file.type});if(!error)return sb.storage.from(CONFIG.MEDIA_BUCKET).getPublicUrl(path).data.publicUrl}catch(e){}}
  if(file.size>2.5*1024*1024)throw Error('This video is too large for device storage. Run the setup SQL (creates the "media" storage bucket) or use a video under 2.5 MB.');
  return blobToDataURL(file)}

async function registerUser(f){
  const email=(f.email||'').trim().toLowerCase(),phone=(f.phone||'').replace(/[^\d+]/g,'');
  if((f.name||'').trim().split(/\s+/).length<2)throw Error('Please enter your full name (first and last name).');
  if(!/^\S+@\S+\.\S+$/.test(email))throw Error('Enter a valid email address.');
  if(phone.replace(/\D/g,'').length<8)throw Error('Enter a valid phone number with country code, e.g. +2348012345678.');
  if((f.password||'').length<8)throw Error('Password must be at least 8 characters.');
  if(!S.tmp.avatar)throw Error('A clear profile photo is required (this keeps SHOPCHATTA free of fake accounts).');
  if(C.profiles.some(p=>p.email===email))throw Error('This email is already registered. Try logging in.');
  if(C.profiles.some(p=>p.phone===phone))throw Error('This phone number is already registered.');
  let id=uid(),pwHash=null;
  if(sb){const {data,error}=await sb.auth.signUp({email,password:f.password,options:{data:{full_name:f.name}}});if(error)throw error;if(!data.user)throw Error('Could not create the account.');id=data.user.id}else pwHash=await sha(f.password);
  const real=C.profiles.filter(p=>!p.seed);
  const admin=(CONFIG.ADMIN_EMAIL&&email===CONFIG.ADMIN_EMAIL.trim().toLowerCase())||(!CONFIG.ADMIN_EMAIL&&real.length===0);
  const p=await dbInsert('profiles',{id,owner:id,name:f.name.trim(),email,phone,photo:S.tmp.avatar,country:f.country||S.country,role:admin?'admin':'user',status:'active',emailVerified:false,phoneVerified:false,verified:false,idVerified:false,sellerStatus:'none',pro:false,rating:0,ratingCount:0,code:'SC-'+id.replace(/-/g,'').slice(0,6).toUpperCase(),referredBy:null,bio:'',lastSeen:now(),pwHash,settings:defaultSettings(),currency:S.cur,lang:S.lang,theme:S.theme,storeName:'',storeOpen:true,storeLocation:''});
  await createWallet(id);
  const refCode=(f.ref||S.ref||'').trim().toUpperCase();
  if(refCode){const r=C.profiles.find(x=>x.code===refCode&&x.id!==id);if(r){await dbUpdate('profiles',id,{referredBy:r.id});await dbInsert('referrals',{referrer:r.id,referred:id,owner:r.id,status:'pending',bonusPaid:false})}}
  S.tmp.avatar=null;
  return startVerification(p)}

  const u=await dbUpdate('profiles',p.uid,{emailVerified:true,phoneVerified:true});S.pending=null;return u}
async function loginUser(email,password){
  email=(email||'').trim().toLowerCase();let p;
  if(sb){const {data,error}=await sb.auth.signInWithPassword({email,password});if(error)throw error;
    p=C.profiles.find(x=>x.id===data.user.id)||C.profiles.find(x=>x.email===email);
    if(!p){p=await dbInsert('profiles',{id:data.user.id,owner:data.user.id,name:(data.user.user_metadata&&data.user.user_metadata.full_name)||email.split('@')[0],email,phone:'',photo:null,country:S.country,role:(CONFIG.ADMIN_EMAIL&&email===CONFIG.ADMIN_EMAIL.trim().toLowerCase())?'admin':'user',status:'active',emailVerified:true,phoneVerified:false,verified:false,idVerified:false,sellerStatus:'none',pro:false,rating:0,ratingCount:0,code:'SC-'+data.user.id.replace(/-/g,'').slice(0,6).toUpperCase(),bio:'',lastSeen:now(),settings:defaultSettings(),currency:S.cur,lang:S.lang,theme:S.theme,storeName:'',storeOpen:true});await createWallet(p.id)}}
  else{p=C.profiles.find(x=>x.email===email&&!x.seed);if(!p||p.pwHash!==await sha(password))throw Error('Wrong email or password.')}

function getProducts(fl=S.f){let a=C.products.filter(p=>{const s=U(p.sellerId);if(s&&s.status==='banned')return false;return true});
  if(fl.status)a=a.filter(p=>p.status===fl.status);else a=a.filter(p=>p.status!=='draft');
  if(fl.q){const q=fl.q.toLowerCase();a=a.filter(p=>(p.title+' '+p.desc+' '+p.cat).toLowerCase().includes(q))}
  if(fl.cat)a=a.filter(p=>p.cat===fl.cat);if(fl.cond)a=a.filter(p=>p.cond===fl.cond);
  if(fl.loc){const l=fl.loc.toLowerCase();a=a.filter(p=>(p.location||'').toLowerCase().includes(l))}
  const mn=fl.min!==''?toUSD(+fl.min,S.cur):null,mx=fl.max!==''?toUSD(+fl.max,S.cur):null;
  if(mn!==null)a=a.filter(p=>toUSD(p.price,p.cur)>=mn);if(mx!==null)a=a.filter(p=>toUSD(p.price,p.cur)<=mx);
  const boosted=p=>p.boostUntil&&new Date(p.boostUntil)>new Date()?1:0;
  const sorters={new:(x,y)=>new Date(y.created_at)-new Date(x.created_at),low:(x,y)=>toUSD(x.price,x.cur)-toUSD(y.price,y.cur),high:(x,y)=>toUSD(y.price,y.cur)-toUSD(x.price,x.cur)};
  return a.sort((x,y)=>boosted(y)-boosted(x)||(sorters[fl.sort]||sorters.new)(x,y))}

const VT={r:null,text:'',active:false};
function voiceToText(on){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(on){VT.text='';if(!SR)return'';try{const r=new SR();r.lang=SPEECH[S.lang]||'en-US';r.continuous=true;r.interimResults=true;let fin='';
    r.onresult=e=>{let interim='';for(let i=e.resultIndex;i<e.results.length;i++){const tx=e.results[i][0].transcript;if(e.results[i].isFinal)fin+=tx+' ';else interim+=tx}VT.text=(fin+interim).trim()};
    r.onerror=()=>{};r.onend=()=>{if(VT.active){try{r.start()}catch(e){}}};VT.r=r;VT.active=true;r.start()}catch(e){}return''}
  VT.active=false;try{VT.r&&VT.r.stop()}catch(e){}return VT.text}
function textToVoice(text){if(!('speechSynthesis' in window)){toast('Text-to-voice is not supported on this browser.','err');return}
  speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(String(text||''));u.lang=SPEECH[S.lang]||'en-US';const v=speechSynthesis.getVoices().find(x=>x.lang&&x.lang.toLowerCase().startsWith((u.lang||'en').slice(0,2).toLowerCase()));if(v)u.voice=v;speechSynthesis.speak(u)}
const REC={on:false,want:false,mr:null,chunks:[],stream:null,t0:0};
async function startRec(){if(REC.on||REC.want)return;REC.want=true;
  try{const stream=await navigator.mediaDevices.getUserMedia({audio:true});if(!REC.want){stream.getTracks().forEach(x=>x.stop());return}
    REC.stream=stream;REC.chunks=[];REC.mr=new MediaRecorder(stream);REC.mr.ondataavailable=e=>{if(e.data.size)REC.chunks.push(e.data)};REC.mr.start();REC.t0=Date.now();REC.on=true;voiceToText(true);
    const b=$('#micBtn');if(b)b.classList.add('rec');const h=$('#recHint');if(h)h.classList.remove('hide');setTimeout(()=>{if(REC.on)stopRec()},60000)}
  catch(e){REC.want=false;toast('Allow microphone access to send voice notes.','err')}}
function stopRec(){REC.want=false;if(!REC.on)return;REC.on=false;const b=$('#micBtn');if(b)b.classList.remove('rec');const h=$('#recHint');if(h)h.classList.add('hide');
  const mr=REC.mr,chatId=S.chatId;voiceToText(false);
  mr.onstop=async()=>{REC.stream.getTracks().forEach(x=>x.stop());const dur=(Date.now()-REC.t0)/1000;if(dur<0.8){toast('Hold the mic a little longer to record.');return}
    await sleep(700);const blob=new Blob(REC.chunks,{type:mr.mimeType||'audio/webm'});if(blob.size>1.4e6){toast('Voice note too long (max ~1 min).','err');return}
    try{const audio=await blobToDataURL(blob);await sendMessage(chatId,'',{kind:'voice',audio,transcript:VT.text||'',dur:Math.round(dur)});renderChatBody()}catch(e){toast(e.message,'err')}};
  try{mr.stop()}catch(e){}}

/* ============================ escrow, orders, disputes, ratings ============================ */
async function buyProduct(pid,o){const u=me();if(!u)throw Error('Please log in first.');needVerified();
  const p=C.products.find(x=>x.id===pid);if(!p||p.status!=='in_stock')throw Error('This product is no longer available.');if(p.sellerId===u.id)throw Error("You can't buy your own product.");
  const seller=U(p.sellerId);if(seller&&seller.storeOpen===false)throw Error('This store is currently closed.');
  const usd=toUSD(p.price,p.cur);const pay=await payWith(o.method,usd,'Escrow payment: '+p.title);
  return processEscrow(null,'hold',{p,u,o,usd,pay})}
async function processEscrow(orderId,action,ctx={}){
  if(action==='hold'){const {p,u,o,usd,pay}=ctx;const commission=+(p.price*CONFIG.COMMISSION).toFixed(2);
    const ord=await dbInsert('orders',{owner:u.id,buyer:u.id,buyerName:u.name,seller:p.sellerId,sellerName:dName(p.sellerId),productId:p.id,title:p.title,photo:(p.photos&&p.photos[0])||null,cat:p.cat,amount:p.price,cur:p.cur,usd,commission,sellerNet:+(p.price-commission).toFixed(2),delivery:o.delivery,address:o.address||'',method:o.method,payRef:pay.ref,status:'escrow',track:[{s:'Ordered',t:now()}]});
    await dbUpdate('products',p.id,{status:'reserved',reservedBy:u.id});await joinStoreChat(p.sellerId,u.id);
    await sendNotification(p.sellerId,'New order 🎉','Congratulations! '+first(u.name)+' bought your '+p.title+' for '+fmt(p.price,p.cur)+'. Payment is safe in escrow — ship it now.',{link:'orders'});
    toast('Payment secured in escrow ✔');return ord}
  const o=C.orders.find(x=>x.id===orderId);if(!o)throw Error('Order not found.');
  if(action==='release'){if(['completed','refunded'].includes(o.status))return o;
    await dbUpdate('orders',o.id,{status:'completed',completedAt:now(),track:[...o.track,{s:'Confirmed',t:now()}]});
    const net=toUSD(o.sellerNet,o.cur),com=toUSD(o.commission,o.cur);
    await walletAdd(o.seller,net,'escrow_release','Sale: '+o.title,{orderId:o.id});
    await dbInsert('transactions',{uid:'platform',owner:'platform',type:'commission',usd:com,note:'5% commission: '+o.title,orderId:o.id});
    await dbUpdate('products',o.productId,{status:'sold'});
    const bw=await createWallet(o.buyer);await dbUpdate('wallets',bw.id,{points:(bw.points||0)+Math.max(1,Math.round(o.usd))});
    await sendNotification(o.seller,'Payment released 💰',first(o.buyerName)+' confirmed delivery. '+fmt(o.sellerNet,o.cur)+' (after 5% commission of '+fmt(o.commission,o.cur)+') is now in your wallet.',{link:'wallet'});
    await applyReferralBonus(o.buyer);await applyReferralBonus(o.seller);return o}
  if(action==='refund'){if(['completed','refunded'].includes(o.status))return o;
    await dbUpdate('orders',o.id,{status:'refunded',track:[...o.track,{s:'Refunded',t:now()}]});await walletAdd(o.buyer,o.usd,'refund','Refund: '+o.title,{orderId:o.id});
    const p=C.products.find(x=>x.id===o.productId);if(p&&p.status==='reserved')await dbUpdate('products',p.id,{status:'in_stock',reservedBy:null});
    await sendNotification(o.buyer,'Refund issued','Your payment of '+fmt(o.amount,o.cur)+' for '+o.title+' was refunded to your SHOPCHATTA wallet.',{link:'wallet'});
    await sendNotification(o.seller,'Order refunded','The order for '+o.title+' was refunded to the buyer.',{link:'orders'});return o}}
const releaseEscrow=id=>processEscrow(id,'release');
async function updateTracking(id,step){const o=C.orders.find(x=>x.id===id);if(!o)return;await dbUpdate('orders',id,{status:step==='Shipped'?'shipped':step==='Delivered'?'delivered':o.status,track:[...o.track,{s:step,t:now()}]});
  await sendNotification(o.buyer,'Order '+step.toLowerCase(),'Your '+o.title+' is now "'+step+'".',{link:'orders'});toast('Marked '+step)}
async function applyReferralBonus(userId){const r=C.referrals.find(x=>x.referred===userId&&!x.bonusPaid);if(!r)return;
  await dbUpdate('referrals',r.id,{bonusPaid:true,status:'paid'});await walletAdd(r.referrer,CONFIG.REF_BONUS_USD,'bonus','Referral bonus: '+dName(userId));await walletAdd(userId,CONFIG.REF_BONUS_USD,'bonus','Welcome referral bonus');
  await sendNotification(r.referrer,'Referral bonus 🎁','Your friend '+first(dName(userId))+' completed a first sale/purchase. You earned '+fmtUSD(CONFIG.REF_BONUS_USD)+'!',{link:'wallet'})}
async function referUser(){const u=me();const link=location.href.split('#')[0]+'?ref='+u.code;const text='Join me on SHOPCHATTA — Shop. Chat. Earn. All In One Place. Use my code '+u.code+': '+link;
  if(navigator.share){try{await navigator.share({title:'SHOPCHATTA',text,url:link});return}catch(e){}}
  try{await navigator.clipboard.writeText(text);toast('Invite link copied!')}catch(e){modal(`<h3>Invite friends</h3><p class="mut">Copy and share:</p><textarea readonly>${esc(text)}</textarea><div class="row end"><button class="btn" data-a="close">Close</button></div>`)}}
async function rateSeller(orderId,stars_,text){const o=C.orders.find(x=>x.id===orderId);if(!o||o.buyer!==S.meId)throw Error('Only the buyer can rate.');if(o.status!=='completed')throw Error('You can rate after the order is completed.');if(C.reviews.some(r=>r.orderId===orderId))throw Error('You already rated this order.');if(!(stars_>=1&&stars_<=5))throw Error('Choose 1 to 5 stars.');
  await dbInsert('reviews',{orderId,owner:S.meId,seller:o.seller,buyer:S.meId,buyerName:me().name,stars:stars_,text:(text||'').trim(),title:o.title});
  const rs=C.reviews.filter(r=>r.seller===o.seller);const avg=rs.reduce((a,r)=>a+r.stars,0)/rs.length;await dbUpdate('profiles',o.seller,{rating:+avg.toFixed(2),ratingCount:rs.length});
  await sendNotification(o.seller,'New review '+stars(stars_),first(me().name)+' rated you '+stars_+'/5'+(text?': '+text.slice(0,80):''),{link:'store/'+o.seller});toast('Thanks for your review!')}
async function createDispute(orderId,reason){const o=C.orders.find(x=>x.id===orderId);if(!o)throw Error('Order not found.');if(!reason||reason.trim().length<10)throw Error('Please describe the problem (at least 10 characters).');
  await dbInsert('disputes',{orderId,owner:S.meId,buyer:o.buyer,seller:o.seller,title:o.title,amount:o.amount,cur:o.cur,reason:reason.trim(),openedBy:S.meId,status:'open'});
  await dbUpdate('orders',orderId,{status:'disputed',track:[...o.track,{s:'Dispute opened',t:now()}]});
  await sendNotification(o.seller==S.meId?o.buyer:o.seller,'Dispute opened','A dispute was opened on "'+o.title+'". Funds stay in escrow until Admin decides.',{link:'orders'});await notifyAdmins('New dispute','Dispute on '+o.title,'admin');toast('Dispute opened — funds remain in escrow')}

const creatorStats=u=>{const posts=C.posts.filter(p=>p.uid===u);return{followers:C.follows.filter(f=>f.following===u).length,posts:posts.length,views:posts.reduce((a,p)=>a+(p.views||0),0),likes:posts.reduce((a,p)=>a+(p.likes||[]).length,0)}};
const isMonetised=u=>{const s=creatorStats(u);return s.followers>=100&&s.posts>=5&&s.views>=1000};
async function createPost(file,caption){const u=me();needVerified();if(!file)throw Error('Choose a photo or video.');const url=await storeMedia(file);
  return dbInsert('posts',{uid:u.id,owner:u.id,kind:file.type.startsWith('video')?'video':'image',url,caption:(caption||'').trim(),likes:[],comments:[],shares:0,views:0})}
const trackView=p=>{if(S.viewed.has(p.id)||p.uid===S.meId)return;S.viewed.add(p.id);S.viewQ.push(p.id)};
async function flushViews(){const q=S.viewQ.splice(0);for(const id of q){const p=C.posts.find(x=>x.id===id);if(!p)continue;await dbUpdate('posts',id,{views:(p.views||0)+1});if(isMonetised(p.uid))await walletAdd(p.uid,0.0004,'ad_earn','Ad revenue share (views)')}}
async function toggleFollow(id){if(!me()){showAuth('login');return}if(id===S.meId)return;const f=C.follows.find(x=>x.follower===S.meId&&x.following===id);
  if(f){await dbDelete('follows',f.id)}else{await dbInsert('follows',{follower:S.meId,following:id,owner:S.meId});await sendNotification(id,'New follower',first(me().name)+' started following you.',{link:'store/'+S.meId})}}
async function tipCreator(creatorId,amountDisp,method){const usd=toUSD(amountDisp,S.cur);if(!(usd>0))throw Error('Enter a tip amount.');await payWith(method,usd,'Tip to '+dName(creatorId));
  await walletAdd(creatorId,usd*0.95,'tip','Tip from '+first(me().name));await dbInsert('transactions',{uid:'platform',owner:'platform',type:'commission',usd:usd*0.05,note:'5% tip fee'});await sendNotification(creatorId,'You got a tip 💚',first(me().name)+' tipped you '+fmtUSD(usd)+'.',{link:'wallet'});toast('Tip sent!')}

const waNumber=u=>{if(!u)return'';const s=u.settings||{};const biz=s.seller&&s.seller.whatsapp;if(biz)return biz;if(s.privacy&&s.privacy.showPhone&&u.phone)return u.phone.replace(/\D/g,'');return''};
const waLink=(num,text)=>num?'https://wa.me/'+num+'?text='+encodeURIComponent(text||''):'';
async function setSetting(path,val){const u=me();if(!u)return;const s=JSON.parse(JSON.stringify(u.settings||defaultSettings()));const keys=path.split('.');let o=s;keys.slice(0,-1).forEach(k=>{o[k]=o[k]||{};o=o[k]});o[keys[keys.length-1]]=val;await dbUpdate('profiles',u.id,{settings:s})}
async function enableBiometric(){if(!window.PublicKeyCredential)throw Error('This browser/device does not support Face ID or fingerprint unlock.');
  const ok=PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable?await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable():false;if(!ok)throw Error('No Face ID / fingerprint sensor found on this device.');
  const u=me();const cred=await navigator.credentials.create({publicKey:{challenge:crypto.getRandomValues(new Uint8Array(32)),rp:{name:'SHOPCHATTA'},user:{id:new TextEncoder().encode(u.id),name:u.email,displayName:u.name},pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],authenticatorSelection:{authenticatorAttachment:'platform',userVerification:'required'},timeout:60000}});
  lsSet('bio_'+u.id,btoa(String.fromCharCode(...new Uint8Array(cred.rawId))));await setSetting('biometric',true)}
async function unlockBiometric(){const u=me();const raw=lsGet('bio_'+u.id,null);if(!raw)throw Error('Biometric key missing on this device — log in again.');const id=Uint8Array.from(atob(raw),c=>c.charCodeAt(0));
  await navigator.credentials.get({publicKey:{challenge:crypto.getRandomValues(new Uint8Array(32)),allowCredentials:[{type:'public-key',id}],userVerification:'required',timeout:60000}});S.unlocked=true}
async function deleteAccount(){const u=me();if(!u)return;const ids=C.products.filter(p=>p.sellerId===u.id).map(p=>p.id);for(const id of ids)await dbDelete('products',id);
  await dbDelete('profiles',u.id);try{if(sb)await sb.auth.signOut()}catch(e){}S.meId=null;lsSet('session',null);toast('Your account was deleted.');go('home')}
function exportData(){const u=me();const mine={};TABLES.forEach(tb=>{mine[tb]=C[tb].filter(r=>[r.owner,r.uid,r.from,r.buyer,r.seller,r.id].includes(u.id)).map(r=>{const c=Object.assign({},r);delete c.pwHash;return c})});const b=new Blob([JSON.stringify(mine,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='shopchatta-my-data.json';a.click()}
const SETUP_SQL=()=>TABLES.map(tb=>`create table if not exists public.${tb} (id text primary key, created_at timestamptz default now(), owner text, data jsonb not null default '{}'::jsonb);\nalter table public.${tb} enable row level security;\ndrop policy if exists "sc_${tb}_all" on public.${tb};\ncreate policy "sc_${tb}_all" on public.${tb} for all to anon, authenticated using (true) with check (true);`).join('\n')+`\n\n-- media bucket for product photos / creator videos\ninsert into storage.buckets (id,name,public) values ('${CONFIG.MEDIA_BUCKET}','${CONFIG.MEDIA_BUCKET}',true) on conflict (id) do nothing;\ndrop policy if exists "sc_media_read" on storage.objects;\ndrop policy if exists "sc_media_write" on storage.objects;\ncreate policy "sc_media_read" on storage.objects for select using (bucket_id='${CONFIG.MEDIA_BUCKET}');\ncreate policy "sc_media_write" on storage.objects for insert to anon, authenticated with check (bucket_id='${CONFIG.MEDIA_BUCKET}');\n\n-- realtime chat (run once; ignore "already member" errors on re-run)\nalter publication supabase_realtime add table ${TABLES.map(x=>'public.'+x).join(', ')};`;

  <div class="pb"><div class="pp">${pconv(p)}</div><div class="pt">${esc(p.title)}</div><div class="pm">📍 ${esc(p.location||'—')} · ${s?esc(s.storeName||s.name):''}</div></div></div>`}
A.openProduct=el=>go('product',el.dataset.id);

  ${p.kind==='video'?`<video controls playsinline preload="metadata" src="${esc(p.url)}"></video>`:`<img class="pm" loading="lazy" src="${esc(p.url)}" alt="">`}
  ${p.caption?`<p style="margin:8px 0">${esc(p.caption)}</p>`:''}
  <div class="row" style="margin-top:6px"><button class="btn btn-o btn-s" data-a="like" data-id="${p.id}" style="${liked?'color:#e0245e;border-color:#e0245e':''}">${ic('heart')} ${(p.likes||[]).length}</button><button class="btn btn-o btn-s" data-a="toggleCm" data-id="${p.id}">${ic('chat')} ${cm.length}</button><button class="btn btn-o btn-s" data-a="sharePost" data-id="${p.id}">${ic('share')} ${p.shares||0}</button>${p.uid!==S.meId?`<button class="btn btn-o btn-s" data-a="tip" data-id="${p.uid}">💚 Tip</button><button class="btn btn-o btn-s" data-a="report" data-k="post" data-id="${p.id}">${ic('flag')}</button>`:''}</div>
  <div id="cm-${p.id}" class="hide">${cm.slice(-5).map(c=>`<div class="sm" style="margin-top:6px"><b>${esc(c.name)}</b> ${esc(c.text)}</div>`).join('')}<form data-f="comment" class="row" style="margin-top:8px;flex-wrap:nowrap"><input type="hidden" name="id" value="${p.id}"><input name="text" placeholder="Add a comment…" required><button class="btn btn-s" type="submit">Post</button></form></div></div>`}
A.toggleCm=el=>{if(needLogin())return;$('#cm-'+el.dataset.id).classList.toggle('hide')};
A.like=async el=>{if(needLogin())return;const p=C.posts.find(x=>x.id===el.dataset.id);const l=p.likes||[];await dbUpdate('posts',p.id,{likes:l.includes(S.meId)?l.filter(x=>x!==S.meId):[...l,S.meId]});if(!l.includes(S.meId)&&p.uid!==S.meId)sendNotification(p.uid,'New like',first(me().name)+' liked your post.',{link:'creator'});render()};
F.comment=async f=>{if(needLogin())return;const p=C.posts.find(x=>x.id===f.id);const owner=U(p.uid);if(owner&&owner.settings&&owner.settings.creator&&owner.settings.creator.comments===false)throw Error('Comments are turned off on this post.');
  await dbUpdate('posts',p.id,{comments:[...(p.comments||[]),{uid:S.meId,name:me().name,text:f.text.slice(0,300),t:now()}]});if(p.uid!==S.meId)sendNotification(p.uid,'New comment',first(me().name)+': '+f.text.slice(0,80),{link:'creator'});render();setTimeout(()=>{const e=$('#cm-'+f.id);e&&e.classList.remove('hide')},30)};

A.tip=el=>{if(needLogin())return;const id=el.dataset.id;const u=U(id);if(u&&u.settings&&u.settings.creator&&u.settings.creator.tips===false)throw Error('This creator has turned tips off.');
  modal(`<h3>Tip ${esc(dName(id))} 💚</h3><form data-f="tip"><input type="hidden" name="id" value="${id}"><label>Amount (${S.cur})</label><input name="amount" type="number" min="1" step="any" required><label>Pay with</label>${payOpts()}<button class="btn btn-g btn-block" type="submit" style="margin-top:12px">Send tip</button></form>`)};

  if(m){const fol=C.follows.filter(f=>f.follower===m.id).map(f=>f.following);const fp=list.filter(p=>fol.includes(p.sellerId)).slice(0,4);if(fp.length)h+=`<div class="sect"><h3>⭐ From stores you follow</h3></div><div class="grid">${fp.map(pcard).join('')}</div>`}
  const posts=C.posts.slice(0,4);if(posts.length)h+=`<div class="sect"><h3>🎬 Creator feed</h3><button class="btn btn-o btn-s" data-a="nav" data-r="creator">More</button></div>${posts.map(postCard).join('')}`;
