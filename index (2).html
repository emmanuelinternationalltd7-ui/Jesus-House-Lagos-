A.dispute=el=>modal(`<h3>Dispute &amp; refund</h3><p class="mut sm">Funds stay in escrow while our team reviews. Fake item? You get a refund.</p><form data-f="dispute"><input type="hidden" name="id" value="${el.dataset.id}"><label>What went wrong?</label><textarea name="reason" required minlength="10" placeholder="Item is fake, not delivered, not as described…"></textarea><button class="btn btn-d btn-block" type="submit" style="margin-top:12px">Open dispute</button></form>`);
F.dispute=async f=>{await createDispute(f.id,f.reason);closeModal();render()};
A.rate=el=>{S.rate={id:el.dataset.id,n:0};modal(`<h3>Rate the seller</h3><div class="row" style="justify-content:center" id="stars">${[1,2,3,4,5].map(i=>`<button class="starbtn" data-a="star" data-n="${i}">★</button>`).join('')}</div><form data-f="rate"><textarea name="text" placeholder="Write a short review (optional)"></textarea><button class="btn btn-g btn-block" type="submit" style="margin-top:12px">Submit review</button></form>`)};
A.star=el=>{S.rate.n=+el.dataset.n;$$('#stars .starbtn').forEach((b,i)=>b.classList.toggle('on',i<S.rate.n))};
F.rate=async f=>{await rateSeller(S.rate.id,S.rate.n,f.text);closeModal();render()};

/* ---------- wallet ---------- */
const TXI={topup:'⬆️',withdraw:'⬇️',payment:'🛒',escrow_release:'💰',refund:'↩️',bonus:'🎁',tip:'💚',ad_earn:'📺',subscription:'⭐'};
R.wallet=()=>{const u=me();const w=wallet(u.id)||{balance:0,points:0};const tx=C.transactions.filter(x=>x.uid===u.id).slice(0,30);const refs=C.referrals.filter(r=>r.referrer===u.id);const idv=C.verifications.find(v=>v.uid===u.id);
  return`<h2>${t('wallet')}</h2><div class="hero" style="padding:18px"><div class="sm" style="opacity:.8">Available balance</div><div style="font-size:2rem;font-weight:800">${fmtUSD(w.balance||0)}</div><div class="sm" style="opacity:.85">🎁 ${w.points||0} Rewards points · 1 pt per ${fmtUSD(1)} spent</div>
  <div class="row" style="margin-top:12px;position:relative;z-index:2"><button class="btn btn-g" data-a="topupModal">+ Top up</button><button class="btn" style="background:rgba(255,255,255,.18)" data-a="withdrawModal">Withdraw</button></div></div>
  <div class="row" style="margin-bottom:12px"><button class="btn btn-o btn-s" data-a="idModal">🪪 ${u.idVerified?'ID verified ✔':idv&&idv.status==='pending'?'ID under review':'Verify ID'}</button>${u.pro?'<span class="pill b">⭐ PRO</span>':'<button class="btn btn-o btn-s" data-a="proModal">⭐ SHOPCHATTA Pro</button>'}</div>
  <div class="card"><div class="row sb"><b>🎁 Refer &amp; earn</b><span class="pill g">${esc(u.code)}</span></div><p class="mut sm">Earn ${fmtUSD(CONFIG.REF_BONUS_USD)} when a friend makes their first sale or purchase. Referred: ${refs.length} · Paid: ${refs.filter(r=>r.bonusPaid).length}</p><button class="btn btn-s" data-a="refer">${ic('share')} Invite friends</button></div>
  <div class="sect"><h3>History</h3></div><div class="card" style="padding:4px 14px">${tx.length?tx.map(x=>`<div class="trow"><div>${TXI[x.type]||'•'} <b>${esc(x.note||x.type)}</b><div class="mut sm">${ago(x.created_at)}${x.status?' · '+x.status:''}</div></div><b style="color:${x.usd>=0?'var(--green2)':'var(--bad)'}">${x.usd>=0?'+':''}${fmtUSD(x.usd)}</b></div>`).join(''):'<p class="mut" style="padding:12px 0">No transactions yet.</p>'}</div>`};
A.topupModal=()=>modal(`<h3>Top up wallet</h3><form data-f="topup"><label>Amount (${S.cur})</label><input name="amount" type="number" min="1" step="any" required><label>Pay with</label><select name="method"><option value="paystack">Paystack</option><option value="stripe">Stripe</option><option value="paypal">PayPal</option></select><button class="btn btn-g btn-block" type="submit" style="margin-top:12px">Continue</button></form>`);
F.topup=async f=>{closeModal();await topUp(f.method,+f.amount);render()};
A.withdrawModal=()=>{const w=wallet(S.meId)||{};const b=w.payout||{};modal(`<h3>Withdraw</h3><p class="mut sm">Balance: ${fmtUSD(w.balance||0)}. Withdrawals of ${fmtUSD(CONFIG.BIG_WITHDRAW_USD)}+ need ID verification (NIN, Passport or Driver's License).</p><form data-f="withdraw"><label>Amount (${S.cur})</label><input name="amount" type="number" min="1" step="any" required><label>Bank / mobile money name</label><input name="bank" required value="${esc(b.name||'')}"><label>Account number</label><input name="number" required value="${esc(b.number||'')}"><label>Account name</label><input name="acct" value="${esc(b.acct||me().name)}"><button class="btn btn-g btn-block" type="submit" style="margin-top:12px">Request withdrawal</button></form>`)};
F.withdraw=async f=>{await withdraw(+f.amount,{name:f.bank,number:f.number,acct:f.acct});closeModal();render()};
A.idModal=()=>{S.tmp.idPhoto=null;modal(`<h3>🪪 Verify your identity</h3><p class="mut sm">Required before big withdrawals and for the Verified badge. Reviewed by the SHOPCHATTA team.</p><form data-f="idsubmit"><label>ID type</label><select name="type"><option>NIN</option><option>International Passport</option><option>Driver's License</option></select><label>ID number</label><input name="number" required><label>Photo of ID</label><input type="file" accept="image/*" data-file="idphoto" required><button class="btn btn-g btn-block" type="submit" style="margin-top:12px">Submit for review</button></form>`)};
FILE.idphoto=async el=>{if(el.files[0])S.tmp.idPhoto=await fileToDataURL(el.files[0],900,.7)};
F.idsubmit=async f=>{await submitID(f.type,f.number);closeModal();render()};
A.refer=()=>referUser();

/* ---------- favourites / store ---------- */
R.favs=()=>{const ids=C.favourites.filter(f=>f.uid===S.meId).map(f=>f.productId);const prods=C.products.filter(p=>ids.includes(p.id));const stores=C.follows.filter(f=>f.follower===S.meId).map(f=>U(f.following)).filter(Boolean);
  return`<h2>${t('fav')}</h2>${prods.length?`<div class="grid">${prods.map(pcard).join('')}</div>`:empty('❤️','Tap the heart on any product to save it here.')}<div class="sect"><h3>Following</h3></div>${stores.length?`<div class="card" style="padding:4px 14px">${stores.map(s=>`<div class="li" data-a="nav" data-r="store" data-id="${s.id}">${avatar(s,44)}<div class="grow"><b>${esc(s.storeName||s.name)}</b> ${badgesOf(s.id)}</div>›</div>`).join('')}</div>`:'<p class="mut">You are not following any stores or creators yet.</p>'}`};
R.store=()=>{const s=U(S.arg);if(!s)return empty('🏪','Store not found.');const pub=!s.settings||!s.settings.privacy||s.settings.privacy.profilePublic!==false||s.id===S.meId||isAdmin();
  if(!pub)return`<div class="card">${avatar(s,60)}<h2>${esc(s.name)}</h2><p class="mut">This profile is private.</p></div>`;
  const prods=C.products.filter(p=>p.sellerId===s.id&&p.status==='in_stock');const revs=C.reviews.filter(r=>r.seller===s.id);const cs=creatorStats(s.id);const wa=waNumber(s);
  return`<button class="btn btn-o btn-s" data-a="back" style="margin-bottom:10px">${ic('back')} Back</button><div class="card"><div class="row" style="flex-wrap:nowrap">${avatar(s,64)}<div class="grow"><h2 style="margin:0">${esc(s.storeName||s.name)} ${badgesOf(s.id)}</h2><div class="mut sm">${s.rating?stars(s.rating)+' '+s.rating+' ('+s.ratingCount+' reviews)':'No reviews yet'} · ${sellerSales(s.id)} sales · ${cs.followers} followers</div>${s.bio?`<p class="sm" style="margin-top:4px">${esc(s.bio)}</p>`:''}</div></div>
  <div class="row" style="margin-top:10px">${s.id!==S.meId?`<button class="btn ${isFollowing(s.id)?'btn-o':''}" data-a="follow" data-id="${s.id}">${isFollowing(s.id)?'Following ✔':'Follow store'}</button><button class="btn btn-o" data-a="chatUser" data-id="${s.id}">${ic('chat')} Message</button>${wa?`<a class="btn btn-wa" target="_blank" rel="noopener" href="${esc(waLink(wa,'Hi from SHOPCHATTA'))}">WhatsApp</a>`:''}<button class="btn btn-o" data-a="report" data-k="user" data-id="${s.id}">${ic('flag')}</button>`:''}</div></div>
  <div class="sect"><h3>Products (${prods.length})</h3></div>${prods.length?`<div class="grid">${prods.map(pcard).join('')}</div>`:'<p class="mut">No products in stock.</p>'}
  <div class="sect"><h3>Reviews</h3></div>${revs.length?revs.map(r=>`<div class="card"><div class="row sb"><b>${esc(first(r.buyerName))}</b><span style="color:#FFB400">${stars(r.stars)}</span></div><div class="sm">${esc(r.text||'')}</div><div class="mut sm">${esc(r.title||'')} · ${ago(r.created_at)}</div></div>`).join(''):'<p class="mut">No reviews yet.</p>'}`};
A.chatUser=async el=>{if(needLogin())return;needVerified();const c=await createChat('private',{peer:el.dataset.id});go('chat',c.id)};

/* ---------- help / notifications / menu ---------- */
R.help=()=>{const faqs=[['How does escrow protect me?','You pay SHOPCHATTA. We hold the money while the seller ships. When you confirm the item arrived, we release it to the seller. If it is fake or never arrives, open a dispute and get a refund.'],['What does it cost to sell?','Listing is free. SHOPCHATTA takes 5% only when a sale completes. Example: a ₦100,000 sale = seller gets ₦95,000, SHOPCHATTA gets ₦5,000.'],['How do I earn as a creator?','Reach 100 followers, 5 posts and 1,000 total views. Then earn from ad views, product sales and tips.'],['Why do I need to verify my ID?','For big withdrawals (NIN, Passport or Driver\'s License) and to earn the Verified badge.'],['Delivery options?','Pickup, bike delivery in the same city, or waybill/courier to other cities. Track Ordered → Shipped → Delivered in Orders.'],['How do I get paid?','Funds from completed sales land in your wallet. Withdraw to your bank or mobile money.']];
  return`<h2>${t('help')} Center</h2>${faqs.map(([q,a])=>`<details class="set"><summary>${q}</summary><div class="in mut">${a}</div></details>`).join('')}
  <div class="card"><b>Still need help?</b><div class="row" style="margin-top:8px"><button class="btn btn-g" data-a="liveSupport">${ic('chat')} Live chat support</button>${CONFIG.SUPPORT_WHATSAPP?`<a class="btn btn-wa" target="_blank" rel="noopener" href="${esc(waLink(CONFIG.SUPPORT_WHATSAPP,'Hi SHOPCHATTA support'))}">WhatsApp</a>`:''}<button class="btn btn-o" data-a="ticketModal">Send a report</button></div></div>`};
A.liveSupport=async()=>{if(needLogin())return;await A.openSupport()};
A.ticketModal=()=>{if(needLogin())return;modal(`<h3>Report a problem</h3><form data-f="ticket"><label>Subject</label><input name="subject" required><label>Details</label><textarea name="body" required></textarea><button class="btn btn-g btn-block" type="submit" style="margin-top:12px">Send</button></form>`)};
F.ticket=async f=>{await dbInsert('tickets',{owner:S.meId,uid:S.meId,name:me().name,subject:f.subject,body:f.body,status:'open'});await notifyAdmins('New support ticket',f.subject,'admin');closeModal();toast('Sent — we will get back to you.')};
R.notifs=()=>{const u=me();const list=C.notifications.filter(n=>n.uid===u.id).sort((a,b)=>new Date(b.created_at)-new Date(a.created_at)).slice(0,60);const log=C.outbox.filter(o=>o.uid===u.id).slice(0,8);
  return`<div class="row sb"><h2>${t('notif')}</h2><button class="btn btn-o btn-s" data-a="readAll">Mark all read</button></div>${list.length?`<div class="card" style="padding:4px 14px">${list.map(n=>`<div class="li" data-a="notif" data-id="${n.id}" style="${n.read?'opacity:.65':''}"><div class="grow"><b>${esc(n.title)}</b><div class="mut sm">${esc(n.body)}</div></div><span class="mut sm">${ago(n.created_at)}</span></div>`).join('')}</div>`:empty('🔔','You are all caught up.')}
  <div class="card sm"><b>Smart delivery</b><p class="mut">When you are offline, important alerts are queued to your Email, WhatsApp and SMS (choose channels in Settings &gt; Notifications). Recent queue:</p>${log.map(o=>`<div class="mut">• ${o.channel.toUpperCase()} → ${esc(o.to)} <span class="pill">${o.status}</span></div>`).join('')||'<div class="mut">Nothing queued.</div>'}<button class="btn btn-o btn-s" style="margin-top:8px" data-a="enablePush">Enable pop-up alerts</button></div>`};
A.readAll=async()=>{for(const n of C.notifications.filter(n=>n.uid===S.meId&&!n.read))await dbUpdate('notifications',n.id,{read:true});render()};
A.notif=async el=>{const n=C.notifications.find(x=>x.id===el.dataset.id);if(!n)return;if(!n.read)await dbUpdate('notifications',n.id,{read:true});if(n.link){const [r,a]=n.link.split('/');go(r,a)}else render()};
A.enablePush=async()=>{if(!window.Notification){toast('Not supported on this browser.','err');return}const p=await Notification.requestPermission();toast(p==='granted'?'Pop-up alerts enabled':'Permission not granted')};
R.menu=()=>{const m=me();const it=(r,i,l)=>`<div class="card" data-a="nav" data-r="${r}">${ic(i)}${l}</div>`;
  if(!m)return`<h2>${t('menu')}</h2><div class="card"><p>${t('slogan')}</p><div class="row"><button class="btn btn-g" data-a="auth" data-m="register">${t('signup')}</button><button class="btn btn-o" data-a="auth" data-m="login">${t('login')}</button></div></div><div class="menu-grid">${it('creator','video',t('creator'))}${it('help','help',t('help'))}</div>`;
  return`<div class="card row">${avatar(m,56)}<div class="grow"><b>${esc(m.name)}</b> ${badgesOf(m.id)}<div class="mut sm">${esc(m.email)}</div></div></div><div class="menu-grid">${it('orders','box',t('orders'))}${it('wallet','wallet',t('wallet'))}${it('creator','video',t('creator'))}${it('favs','heart',t('fav'))}${it('notifs','bell',t('notif'))}${it('settings','cog',t('settings'))}${it('help','help',t('help'))}${isAdmin()?it('admin','shield','Admin'):''}<div class="card" data-a="refer">${ic('gift')}Refer &amp; earn</div><div class="card" data-a="logout">${ic('close')}${t('logout')}</div></div>`};

/* ---------- settings (10 sections) ---------- */
R.settings=()=>{const u=me();const st=u.settings||defaultSettings();const g=p=>p.split('.').reduce((o,k)=>o&&o[k],st);const w=wallet(u.id)||{};
  const tog=(p,l,sub)=>`<div class="trow"><div>${l}${sub?`<div class="mut sm">${sub}</div>`:''}</div><label class="sw" style="margin:0"><input type="checkbox" data-set="${p}" ${g(p)?'checked':''}><i></i></label></div>`;
  const sec=(k,title,body)=>`<details class="set" ${S.openSet===k?'open':''} data-sec="${k}"><summary>${title}</summary><div class="in">${body}</div></details>`;
  const earned=C.orders.filter(o=>o.seller===u.id&&o.status==='completed');const comm=earned.reduce((a,o)=>a+toUSD(o.commission,o.cur),0),net=earned.reduce((a,o)=>a+toUSD(o.sellerNet,o.cur),0);const cs=creatorStats(u.id);
  return`<h2>${t('settings')}</h2>
  ${sec('profile','1. Profile',`<form data-f="saveProfile"><div class="avpick" data-a="pickAvatar2" id="avPrev"><img src="${esc(u.photo||'')}" alt="" onerror="this.replaceWith('Add photo')"></div><input type="file" id="avFile2" accept="image/*" data-file="avatar" class="hide"><label>Full name</label><input name="name" value="${esc(u.name)}" required><label>Bio</label><textarea name="bio" maxlength="200">${esc(u.bio||'')}</textarea><label>Phone</label><input name="phone" value="${esc(u.phone||'')}" type="tel"><div class="row" style="margin:8px 0"><span class="pill ${u.emailVerified?'g':'w'}">Email ${u.emailVerified?'verified':'not verified'}</span><span class="pill ${u.phoneVerified?'g':'w'}">Phone ${u.phoneVerified?'verified':'not verified'}</span>${!u.emailVerified||!u.phoneVerified?'<button type="button" class="btn btn-s" data-a="reverify">Verify now</button>':''}</div><button class="btn btn-g" type="submit">Save profile</button></form>`)}
  ${sec('account','2. Account &amp; Security',`<form data-f="changePw"><label>New password</label><input name="pw" type="password" minlength="8" autocomplete="new-password" required><button class="btn btn-s" type="submit" style="margin-top:8px">Change password</button></form>${tog('twoStep','2-Step verification','Code by email at login')}<div class="trow"><div>Face ID / Fingerprint<div class="mut sm">${g('biometric')?'Enabled on this device':'Unlock the app with biometrics'}</div></div>${g('biometric')?'<button class="btn btn-o btn-s" data-a="bioOff">Turn off</button>':'<button class="btn btn-s" data-a="bioOn">Enable</button>'}</div><div class="trow"><div>Verified Badge<div class="mut sm">${u.verified?'You are verified ✔':'Verify your ID to earn the badge'}</div></div>${u.verified?verBadge:'<button class="btn btn-s" data-a="idModal">Get verified</button>'}</div><div class="trow"><div><b style="color:var(--bad)">Delete account</b><div class="mut sm">Removes your profile and listings</div></div><button class="btn btn-d btn-s" data-a="delAcc">Delete</button></div>`)}
  ${sec('privacy','3. Privacy',`${tog('privacy.showPhone','Show my phone / WhatsApp to chat partners')}${tog('privacy.showOnline','Show when I am online')}${tog('privacy.profilePublic','Public profile')}<div class="trow"><div>Who can message me</div><select data-set="privacy.whoMessages" style="width:auto"><option value="everyone" ${g('privacy.whoMessages')==='everyone'?'selected':''}>Everyone</option><option value="followers" ${g('privacy.whoMessages')==='followers'?'selected':''}>Followers only</option></select></div>`)}
  ${sec('notifications','4. Notifications',`${tog('notif.inapp','In-App')}${tog('notif.email','Email (when offline)')}${tog('notif.whatsapp','WhatsApp (when offline)')}${tog('notif.sms','SMS (when offline)')}<button class="btn btn-o btn-s" style="margin-top:8px" data-a="enablePush">Enable pop-up alerts</button>`)}
  ${sec('chat','5. Chat Settings',`${tog('chat.enterSend','Press Enter to send')}${tog('chat.readReceipts','Read receipts')}${tog('chat.autoTranscribe','Show voice-note text automatically')}${tog('chat.autoRead','Read new messages aloud (text to voice)')}`)}
  ${sec('seller','6. Marketplace &amp; Seller',`<div class="trow"><div>Store open<div class="mut sm">Closed stores can't receive orders</div></div><label class="sw" style="margin:0"><input type="checkbox" data-setp="storeOpen" ${u.storeOpen!==false?'checked':''}><i></i></label></div><div class="card" style="background:var(--bg)"><b>Commission: 5% per completed sale</b><div class="mut sm">Sales: ${earned.length} · You earned ${fmtUSD(net)} · Commission paid ${fmtUSD(comm)}. Listing is always free.</div></div><b class="sm">Shipping options you offer</b>${tog('seller.shipPickup','Pickup')}${tog('seller.shipBike','Bike delivery')}${tog('seller.shipWaybill','Waybill / Courier')}<label>Business WhatsApp (country code, digits only)</label><input data-set="seller.whatsapp" value="${esc(g('seller.whatsapp')||'')}" placeholder="2348012345678"><div class="row" style="margin-top:8px"><button class="btn btn-s" data-a="nav" data-r="sell">Open seller hub</button></div>`)}
  ${sec('wallet','7. Wallet, Payments &amp; Currency',`<div class="trow"><div>Balance</div><b>${fmtUSD(w.balance||0)}</b></div><label>Currency (${CURS.length} supported)</label><select data-setp="currency">${CURS.map(c=>`<option value="${c}" ${S.cur===c?'selected':''}>${c} — ${esc(CUR_NAMES(c))}</option>`).join('')}</select><label>Preferred payment gateway</label><select data-set="wallet.gateway"><option value="paystack" ${g('wallet.gateway')==='paystack'?'selected':''}>Paystack</option><option value="stripe" ${g('wallet.gateway')==='stripe'?'selected':''}>Stripe</option><option value="paypal" ${g('wallet.gateway')==='paypal'?'selected':''}>PayPal</option></select><div class="row" style="margin-top:8px"><button class="btn btn-s" data-a="topupModal">Top up</button><button class="btn btn-o btn-s" data-a="withdrawModal">Withdraw</button><button class="btn btn-o btn-s" data-a="nav" data-r="wallet">Wallet</button></div>`)}
  ${sec('lang','8. Language &amp; Appearance',`<label>Language</label><select data-setp="lang">${Object.entries(LANGS).map(([k,v])=>`<option value="${k}" ${S.lang===k?'selected':''}>${v}</option>`).join('')}</select><label>Theme</label><select data-setp="theme"><option value="light" ${S.theme==='light'?'selected':''}>Light</option><option value="dark" ${S.theme==='dark'?'selected':''}>Dark</option><option value="system" ${S.theme==='system'?'selected':''}>Match device</option></select>`)}
  ${sec('creator','9. Creator Settings',`<div class="card" style="background:var(--bg)"><b>${isMonetised(u.id)?'Monetised ✔':'Earning locked'}</b><div class="mut sm">${cs.followers}/100 followers · ${cs.posts}/5 posts · ${cs.views}/1,000 views</div></div>${tog('creator.tips','Allow tips')}${tog('creator.comments','Allow comments')}<button class="btn btn-s" style="margin-top:8px" data-a="nav" data-r="creator">Go to Creator</button>`)}
  ${sec('data','10. Data, Storage &amp; Help',`<div class="trow"><div>Database<div class="mut sm">${sb?(S.cloudErr?'Supabase connected — tables need setup':'Supabase connected ✔'):'Local mode (add Supabase URL + key in CONFIG)'}</div></div><span class="pill ${sb&&!S.cloudErr?'g':'w'}">${sb?'Cloud':'Local'}</span></div><div class="row" style="margin-top:8px"><button class="btn btn-s" data-a="sql">Supabase setup SQL</button><button class="btn btn-o btn-s" data-a="exportData">Export my data</button><button class="btn btn-o btn-s" data-a="clearCache">Clear device cache</button><button class="btn btn-o btn-s" data-a="nav" data-r="help">Help Center</button><button class="btn btn-o btn-s" data-a="liveSupport">Live chat support</button></div>`)}
  <button class="btn btn-o btn-block" data-a="logout" style="margin-top:6px">${t('logout')}</button>`};
A.pickAvatar2=()=>$('#avFile2').click();
F.saveProfile=async f=>{const patch={name:f.name.trim(),bio:f.bio||'',phone:(f.phone||'').replace(/[^\d+]/g,'')};if(patch.name.split(/\s+/).length<2)throw Error('Please use your full name.');if(S.tmp.avatar){patch.photo=S.tmp.avatar;S.tmp.avatar=null}await dbUpdate('profiles',S.meId,patch);toast('Profile saved');render()};
F.changePw=async f=>{if(sb){const {error}=await sb.auth.updateUser({password:f.pw});if(error)throw error}else await dbUpdate('profiles',S.meId,{pwHash:await sha(f.pw)});toast('Password changed');render()};
A.reverify=async()=>{await startVerification(me());showVerify()};
A.bioOn=async()=>{await enableBiometric();toast('Biometric unlock enabled ✔');render()};
A.bioOff=async()=>{await setSetting('biometric',false);render()};
A.delAcc=async()=>{if(await askModal('Delete your account?','This permanently removes your profile and listings. It cannot be undone.','Delete forever'))await deleteAccount()};
A.exportData=()=>exportData();
A.clearCache=async()=>{if(await askModal('Clear device cache?','Removes the local copy on this device. '+(sb?'Your cloud data stays safe.':'<b>No cloud is connected — this erases ALL local data!</b>'),'Clear')){Object.keys(localStorage).filter(k=>k.startsWith(LS)&&!k.startsWith(LS+'bio_')).forEach(k=>localStorage.removeItem(k));location.reload()}};
async function setProfileField(k,v){await dbUpdate('profiles',S.meId,{[k]:v});if(k==='lang'){S.lang=v;lsSet('lang',v)}if(k==='theme'){S.theme=v;lsSet('theme',v);applyTheme()}if(k==='currency'){S.cur=v;lsSet('cur',v)}render()}

/* ---------- admin ---------- */
R.admin=()=>{const tabs=[['overview','Overview'],['users','Users'],['sellers','Sellers'],['disputes','Disputes'],['ids','ID checks'],['ads','Ads'],['reports','Reports'],['support','Support'],['announce','Announce']];
  const real=C.profiles.filter(p=>!p.seed);const done=C.orders.filter(o=>o.status==='completed');const sales=done.reduce((a,o)=>a+o.usd,0);const commission=C.transactions.filter(x=>x.uid==='platform'&&x.type==='commission').reduce((a,x)=>a+x.usd,0);const other=C.transactions.filter(x=>x.uid==='platform'&&x.type==='revenue').reduce((a,x)=>a+x.usd,0);
  const pend={sellers:real.filter(p=>p.sellerStatus==='pending'),disp:C.disputes.filter(d=>d.status==='open'),ids:C.verifications.filter(v=>v.status==='pending'),ads:C.ads.filter(a=>a.status==='pending'),rep:C.reports.filter(r=>r.status==='open')};
  const badge=k=>{const n={sellers:pend.sellers.length,disputes:pend.disp.length,ids:pend.ids.length,ads:pend.ads.length,reports:pend.rep.length}[k];return n?` <span class="pill r">${n}</span>`:''};
  let b='';const tb=S.adminTab;
  if(tb==='overview')b=`<div class="stats"><div class="stat"><b>${real.length}</b>Total users</div><div class="stat"><b>${done.length}</b>Completed sales</div><div class="stat"><b>${fmtUSD(sales)}</b>Total sales value</div><div class="stat"><b>${fmtUSD(commission)}</b>Total commission (5%)</div><div class="stat"><b>${fmtUSD(other)}</b>Pro, boosts &amp; ads</div><div class="stat"><b>${pend.disp.length}</b>Open disputes</div><div class="stat"><b>${C.products.length}</b>Products</div><div class="stat"><b>${C.orders.filter(o=>['escrow','shipped','delivered'].includes(o.status)).length}</b>Orders in escrow</div></div><div class="card"><b>Latest orders</b>${C.orders.slice(0,6).map(o=>`<div class="trow"><div>${esc(o.title)}<div class="mut sm">${esc(o.buyerName)} → ${esc(o.sellerName)}</div></div><div style="text-align:right"><b>${fmt(o.amount,o.cur)}</b><div class="mut sm">${(OST[o.status]||[o.status])[0]}</div></div></div>`).join('')||'<p class="mut">No orders yet.</p>'}</div>`;
  if(tb==='users')b=`<div class="card scroll"><table class="tbl"><tr><th>User</th><th>Role</th><th>Status</th><th></th></tr>${real.map(p=>`<tr><td><b>${esc(p.name)}</b><div class="mut sm">${esc(p.email)}</div></td><td>${p.role}${p.verified?' ✔':''}</td><td><span class="pill ${p.status==='banned'?'r':'g'}">${p.status}</span></td><td>${p.role==='admin'?'':p.status==='banned'?`<button class="btn btn-s" data-a="unban" data-id="${p.id}">Unban</button>`:`<button class="btn btn-d btn-s" data-a="ban" data-id="${p.id}">Ban</button>`}</td></tr>`).join('')}</table></div>`;
  if(tb==='sellers')b=`<div class="card"><b>Seller applications</b>${real.filter(p=>p.sellerStatus&&p.sellerStatus!=='none').map(p=>`<div class="trow"><div><b>${esc(p.storeName)}</b><div class="mut sm">${esc(p.name)} · ${esc(p.storeLocation||'')} · <span class="pill ${p.sellerStatus==='approved'?'g':p.sellerStatus==='pending'?'w':'r'}">${p.sellerStatus}</span></div></div><div class="row">${p.sellerStatus!=='approved'?`<button class="btn btn-g btn-s" data-a="sellerOk" data-id="${p.id}">Approve</button>`:''}${p.sellerStatus!=='rejected'?`<button class="btn btn-o btn-s" data-a="sellerNo" data-id="${p.id}">Reject</button>`:''}</div></div>`).join('')||'<p class="mut">No applications.</p>'}</div>`;
  if(tb==='disputes')b=C.disputes.length?C.disputes.map(d=>`<div class="card"><div class="row sb"><b>${esc(d.title)}</b><span class="pill ${d.status==='open'?'r':'g'}">${d.status}</span></div><div class="mut sm">${esc(dName(d.buyer))} vs ${esc(dName(d.seller))} · ${fmt(d.amount,d.cur)} · ${ago(d.created_at)}</div><p class="sm" style="margin:6px 0">${esc(d.reason)}</p>${d.status==='open'?`<div class="row"><button class="btn btn-s" data-a="resolve" data-id="${d.id}" data-r="refund">Refund buyer</button><button class="btn btn-g btn-s" data-a="resolve" data-id="${d.id}" data-r="release">Release to seller</button></div>`:`<div class="mut sm">Resolution: ${esc(d.resolution||'')}</div>`}</div>`).join(''):empty('✅','No disputes.');
  if(tb==='ids')b=C.verifications.length?C.verifications.map(v=>`<div class="card"><div class="row" style="flex-wrap:nowrap"><img src="${esc(v.photo)}" style="width:70px;height:70px;object-fit:cover;border-radius:10px" alt=""><div class="grow"><b>${esc(v.name)}</b><div class="mut sm">${esc(v.idType)} · ${esc(v.idNumber)} · <span class="pill ${v.status==='pending'?'w':v.status==='approved'?'g':'r'}">${v.status}</span></div></div></div>${v.status==='pending'?`<div class="row" style="margin-top:8px"><button class="btn btn-g btn-s" data-a="idOk" data-id="${v.id}">Approve</button><button class="btn btn-o btn-s" data-a="idNo" data-id="${v.id}">Reject</button></div>`:''}</div>`).join(''):empty('🪪','No ID submissions.');
  if(tb==='ads')b=C.ads.length?C.ads.map(a=>`<div class="card"><div class="row sb"><b>${esc(a.brand)}</b><span class="pill ${a.status==='approved'?'g':a.status==='pending'?'w':'r'}">${a.status}</span></div><div class="sm">${esc(a.headline)} · ${fmtUSD(a.usd)}</div>${a.status==='pending'?`<div class="row" style="margin-top:8px"><button class="btn btn-g btn-s" data-a="adOk" data-id="${a.id}">Approve</button><button class="btn btn-o btn-s" data-a="adNo" data-id="${a.id}">Reject</button></div>`:''}</div>`).join(''):empty('📣','No ads yet.');
  if(tb==='reports')b=C.reports.length?C.reports.map(r=>`<div class="card"><div class="row sb"><b>${esc(r.kind)} report</b><span class="pill ${r.status==='open'?'r':'g'}">${r.status}</span></div><div class="sm">${esc(r.reason)}</div><div class="mut sm">by ${esc(r.byName)} · ${ago(r.created_at)}</div>${r.status==='open'?`<div class="row" style="margin-top:8px"><button class="btn btn-s" data-a="repOpen" data-id="${r.id}">View item</button><button class="btn btn-d btn-s" data-a="repAct" data-id="${r.id}">Take down / ban</button><button class="btn btn-o btn-s" data-a="repDone" data-id="${r.id}">Dismiss</button></div>`:''}</div>`).join(''):empty('🚩','No reports.');
  if(tb==='support')b=`<div class="card"><b>Live chats</b>${C.chats.filter(c=>c.type==='support').map(c=>`<div class="li" data-a="nav" data-r="chat" data-id="${c.id}">${avatar(c.members[0],40)}<div class="grow"><b>${esc(dName(c.members[0]))}</b><div class="mut sm">${esc(c.lastMsg||'')}</div></div><span class="mut sm">${c.lastAt?ago(c.lastAt):''}</span></div>`).join('')||'<p class="mut">No chats.</p>'}</div><div class="card"><b>Tickets</b>${C.tickets.map(x=>`<div class="trow"><div><b>${esc(x.subject)}</b><div class="mut sm">${esc(x.name)} — ${esc(x.body)}</div></div>${x.status==='open'?`<button class="btn btn-s" data-a="tkDone" data-id="${x.id}">Resolve</button>`:'<span class="pill g">done</span>'}</div>`).join('')||'<p class="mut">No tickets.</p>'}</div>`;
  if(tb==='announce')b=`<div class="card"><b>Post announcement</b><form data-f="announce"><label>Title</label><input name="title" required><label>Message</label><textarea name="body" required></textarea><button class="btn btn-g btn-block" type="submit" style="margin-top:10px">Publish to everyone</button></form></div>${C.announcements.map(a=>`<div class="card row sb"><div><b>${esc(a.title)}</b><div class="mut sm">${esc(a.body)}</div></div><button class="btn btn-o btn-s" data-a="delAnn" data-id="${a.id}">${ic('trash')}</button></div>`).join('')}`;
  return`<h2>👑 Admin — Emmanuel</h2><div class="tabs">${tabs.map(([k,l])=>`<button class="${tb===k?'on':''}" data-a="adminTab" data-t="${k}">${l}${badge(k)}</button>`).join('')}</div>${b}`};
A.adminTab=el=>{S.adminTab=el.dataset.t;render()};
A.ban=async el=>{if(!await askModal('Ban this user?','They will be logged out of access and their listings hidden.','Ban'))return;const id=el.dataset.id;await dbUpdate('profiles',id,{status:'banned'});for(const p of C.products.filter(p=>p.sellerId===id&&p.status==='in_stock'))await dbUpdate('products',p.id,{status:'draft'});toast('User banned');render()};
A.unban=async el=>{await dbUpdate('profiles',el.dataset.id,{status:'active'});render()};
A.sellerOk=async el=>{const id=el.dataset.id;await dbUpdate('profiles',id,{sellerStatus:'approved'});await ensureStoreChat(id);await sendNotification(id,'Store approved 🎉','Your store is approved. You can now publish products!',{link:'sell'});render()};
A.sellerNo=async el=>{await dbUpdate('profiles',el.dataset.id,{sellerStatus:'rejected'});await sendNotification(el.dataset.id,'Store application update','Your store application was not approved. Contact support for details.',{link:'help'});render()};
A.resolve=async el=>{const d=C.disputes.find(x=>x.id===el.dataset.id);const refund=el.dataset.r==='refund';if(!await askModal(refund?'Refund the buyer?':'Release to seller?','This moves the escrow funds and cannot be undone.','Confirm'))return;
  if(refund)await processEscrow(d.orderId,'refund');else await releaseEscrow(d.orderId);await dbUpdate('disputes',d.id,{status:'resolved',resolution:refund?'Refunded to buyer':'Released to seller',resolvedBy:S.meId});
  await sendNotification(d.buyer,'Dispute resolved',refund?'You were refunded.':'Funds were released to the seller.',{link:'orders'});await sendNotification(d.seller,'Dispute resolved',refund?'The buyer was refunded.':'Funds were released to you.',{link:'orders'});render()};
A.idOk=async el=>{const v=C.verifications.find(x=>x.id===el.dataset.id);await dbUpdate('verifications',v.id,{status:'approved'});await dbUpdate('profiles',v.uid,{idVerified:true,verified:true});await sendNotification(v.uid,'ID verified ✔','You now have the Verified badge and can make large withdrawals.',{link:'wallet'});render()};
A.idNo=async el=>{const v=C.verifications.find(x=>x.id===el.dataset.id);await dbUpdate('verifications',v.id,{status:'rejected'});await sendNotification(v.uid,'ID not accepted','Please resubmit a clear photo of a valid ID.',{link:'wallet'});render()};
A.adOk=async el=>{await dbUpdate('ads',el.dataset.id,{status:'approved'});render()};A.adNo=async el=>{await dbUpdate('ads',el.dataset.id,{status:'rejected'});render()};
A.repOpen=el=>{const r=C.reports.find(x=>x.id===el.dataset.id);if(r.kind==='product')go('product',r.targetId);else if(r.kind==='user')go('store',r.targetId);else go('creator')};
A.repAct=async el=>{const r=C.reports.find(x=>x.id===el.dataset.id);if(!await askModal('Take action?','Product/post will be removed; a reported user will be banned.','Confirm'))return;
  if(r.kind==='product')await dbDelete('products',r.targetId);else if(r.kind==='post')await dbDelete('posts',r.targetId);else if(r.kind==='user')await dbUpdate('profiles',r.targetId,{status:'banned'});await dbUpdate('reports',r.id,{status:'actioned'});render()};
A.repDone=async el=>{await dbUpdate('reports',el.dataset.id,{status:'dismissed'});render()};
A.tkDone=async el=>{await dbUpdate('tickets',el.dataset.id,{status:'done'});render()};
F.announce=async f=>{await dbInsert('announcements',{owner:S.meId,title:f.title,body:f.body});await Promise.all(C.profiles.filter(p=>!p.seed&&p.id!==S.meId).slice(0,500).map(p=>dbInsert('notifications',{uid:p.id,owner:p.id,title:'📢 '+f.title,body:f.body,link:'home',read:false})));toast('Announcement published');render()};
A.delAnn=async el=>{await dbDelete('announcements',el.dataset.id);render()};

/* ---------- global events ---------- */
async function run(fn){try{await fn()}catch(err){console.error(err);toast(err&&err.message?err.message:String(err),'err')}}
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el)return;const fn=A[el.dataset.a];if(!fn)return;run(()=>fn(el,e))});
document.addEventListener('submit',e=>{const f=e.target.closest('form[data-f]');if(!f)return;e.preventDefault();const fn=F[f.dataset.f];if(!fn)return;const data=Object.fromEntries(new FormData(f));const b=f.querySelector('button[type=submit]');if(b)b.disabled=true;run(()=>fn(data,f)).finally(()=>{if(b)b.disabled=false})});
document.addEventListener('input',e=>{const el=e.target;if(el.dataset.i===undefined)return;if(el.dataset.i==='curq'){$('#curList').innerHTML=curList(el.value);return}S.f[el.dataset.i]=el.value;clearTimeout(S.gt);S.gt=setTimeout(refreshGrid,150)});
document.addEventListener('change',e=>{const el=e.target;
  if(el.dataset.set!==undefined){const v=el.type==='checkbox'?el.checked:el.value;run(async()=>{await setSetting(el.dataset.set,v);toast('Saved')});return}
  if(el.dataset.setp!==undefined){const v=el.type==='checkbox'?el.checked:el.value;run(()=>setProfileField(el.dataset.setp,v));return}
  if(el.dataset.file&&FILE[el.dataset.file]){run(()=>FILE[el.dataset.file](el));return}
  if(el.dataset.i!==undefined&&el.tagName==='SELECT'){S.f[el.dataset.i]=el.value;refreshGrid()}});
document.addEventListener('toggle',e=>{const d=e.target;if(d.dataset&&d.dataset.sec&&d.open)S.openSet=d.dataset.sec},true);
document.addEventListener('keydown',e=>{if(e.target.id==='chatInput'&&e.key==='Enter'&&!e.shiftKey){const on=(((me()||{}).settings||{}).chat||{}).enterSend!==false;if(on){e.preventDefault();run(A.sendMsg)}}});
document.addEventListener('pointerdown',e=>{if(e.target.closest('#micBtn')){e.preventDefault();startRec()}});
['pointerup','pointercancel'].forEach(ev=>document.addEventListener(ev,()=>{if(REC.on||REC.want)stopRec()}));
document.addEventListener('contextmenu',e=>{if(e.target.closest('#micBtn'))e.preventDefault()});

/* ---------- demo seed + boot ---------- */
function seedDemo(){const sid='seed-techhub';if(!U(sid)){C.profiles.push({id:sid,created_at:now(),name:'TechHub Lagos',storeName:'TechHub Lagos',email:'demo@techhub.example',phone:'',photo:null,role:'user',status:'active',verified:true,idVerified:true,seed:true,sellerStatus:'approved',storeOpen:true,rating:4.8,ratingCount:12,emailVerified:true,phoneVerified:true,settings:defaultSettings(),code:'SC-DEMO01',pro:true,lastSeen:now(),storeLocation:'Lagos, Nigeria',bio:'Demo store — trusted gadgets & repairs.'});lsSet('t_profiles',C.profiles)}
  const items=[['iPhone 14 Pro 256GB','Phones','used',1200000,'Space Black, 91% battery health, with box & charger.'],['Samsung Galaxy S23 Ultra','Phones','new',980000,'Sealed, 12GB/256GB, 1-year warranty.'],['HP EliteBook 840 G8','Laptops','refurbished',250000,'Core i7 11th gen, 16GB RAM, 512GB SSD, 14" FHD.'],['MacBook Air M2 13"','Laptops','new',1450000,'8GB / 256GB, Midnight. Sealed.'],['AirPods Pro (2nd gen)','Accessories','new',185000,'USB-C, active noise cancellation.'],['Anker 20,000mAh Power Bank','Accessories','new',45000,'65W fast charging for phones and laptops.'],['Apple Watch Series 9 45mm','Gadgets','used',420000,'GPS, Midnight aluminium, minimal wear.'],['Smart Wi-Fi Bulb 4-pack','Smart Home','new',28000,'RGB, works with Alexa & Google Home.'],['Microsoft Office 2021 Licence','Software','new',35000,'Lifetime key, instant delivery.'],['Laptop Repair & Upgrade','Tech Services','new',15000,'Screen, battery, SSD/RAM upgrades. Same-day in Lagos.']];
  items.forEach(([title,cat,cond,price,desc],i)=>C.products.push({id:'demo-'+i,created_at:new Date(Date.now()-i*36e5).toISOString(),owner:sid,sellerId:sid,title,cat,cond,price,cur:'NGN',desc,location:'Lagos, Nigeria',photos:[],status:'in_stock',views:20+i*7,demo:true,boostUntil:i<2?new Date(Date.now()+7*864e5).toISOString():null}));lsSet('t_products',C.products)}
async function boot(){
  document.head.insertAdjacentHTML('beforeend','<style>.acts svg{width:14px;height:14px}#micBtn svg{width:22px;height:22px}.sendb svg{width:20px;height:20px}.hero .btn{position:relative;z-index:2}</style>');
  $('#splashLogo').innerHTML=logo(86);applyTheme();
  try{const q=new URLSearchParams(location.search).get('ref');if(q)S.ref=q.toUpperCase()}catch(e){}
  const h=location.hash.slice(1).split('/');if(h[0]&&R[h[0]]){S.route=h[0];S.arg=h[1]||null}
  if(sb){try{const {data}=await sb.auth.getSession();S.meId=data.session?data.session.user.id:S.meId;if(!data.session)S.meId=null;lsSet('session',S.meId)}catch(e){}await loadAll();startRealtime()}
  else if(!C.products.length)seedDemo();
  await ensureGeneralChats();
  if(S.meId&&!me())S.meId=null;
  const m=me();if(m){if(m.status==='banned'){S.meId=null;lsSet('session',null);toast('This account is banned.','err')}else{S.unlocked=false;if(m.lang)S.lang=m.lang;if(m.theme){S.theme=m.theme}if(m.currency)S.cur=m.currency;applyTheme();if(!(m.settings&&m.settings.biometric))S.unlocked=true;dbUpdate('profiles',m.id,{lastSeen:now()})}}
  render();loadLiveRates();refineCountryByIP();
  setInterval(()=>{const u=me();if(u)dbUpdate('profiles',u.id,{lastSeen:now()})},60000);
  setInterval(()=>{if(sb&&S.route==='chat')refreshTable('messages').then(renderChatBody)},4000);
  if(sb&&m&&(!m.emailVerified||!m.phoneVerified)){}
  const sp=$('#splash');sp.style.opacity=0;setTimeout(()=>sp.remove(),450)}
Object.assign(window,{registerUser,loginUser,uploadProduct,getProducts,buyProduct,createChat,sendMessage,voiceToText,textToVoice,sendNotification,createWallet,processEscrow,releaseEscrow,rateSeller,createDispute,referUser});
boot();
